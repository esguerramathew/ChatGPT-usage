<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Reset</title>
</head>
<body>
  <main>
    <header>
      <div><p class="app-label">RESET</p><h1>Accounts</h1></div>
      <button id="add" class="add-button" aria-label="Add account">+</button>
    </header>
    <div class="section-title"><span>Tap a card for details</span><span id="count">0</span></div>
    <div id="accounts"></div>
    <details class="setup" id="notification-settings">
      <summary><span>Notifications <span id="notification-state" class="notification-state"></span></span><span class="disclosure" aria-hidden="true">⌄</span></summary>
      <div class="setup-content">
        <p id="install">iPhone: Safari → Share → Add to Home Screen. iOS 16.4+.</p>
        <div class="setup-actions">
          <button id="enable" class="secondary">Enable</button>
          <button id="test" class="text" hidden>Test notification</button>
        </div>
      </div>
    </details>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry" class="text" hidden>Retry sync</button>
    <footer>Every 5 hours from your saved time.<br>Adjust if ChatGPT shows a different reset.</footer>
  </main>
  <aside id="undo-bar" class="undo-bar" hidden aria-label="Removed account"><span id="undo-message" role="status"></span><button id="undo">Undo</button><button id="dismiss-undo" aria-label="Dismiss undo">×</button></aside>
  <dialog id="editor" aria-labelledby="form-title">
    <form id="form" novalidate>
      <div class="section-title"><h2 id="form-title">Add account</h2><button type="button" id="close" class="close-button" aria-label="Close">×</button></div>
      <label>Name<input id="name" maxlength="60" placeholder="Personal" required autocomplete="off"></label>
      <label>Email <span class="optional">optional</span><input id="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <fieldset class="color-picker"><legend>Color</legend>
        <label class="color-option"><input type="radio" name="color" value="blue" checked><span class="swatch color-blue"></span><span class="sr-only">Blue</span></label>
        <label class="color-option"><input type="radio" name="color" value="green"><span class="swatch color-green"></span><span class="sr-only">Green</span></label>
        <label class="color-option"><input type="radio" name="color" value="purple"><span class="swatch color-purple"></span><span class="sr-only">Purple</span></label>
        <label class="color-option"><input type="radio" name="color" value="orange"><span class="swatch color-orange"></span><span class="sr-only">Orange</span></label>
        <label class="color-option"><input type="radio" name="color" value="pink"><span class="swatch color-pink"></span><span class="sr-only">Pink</span></label>
        <label class="color-option"><input type="radio" name="color" value="slate"><span class="swatch color-slate"></span><span class="sr-only">Slate</span></label>
      </fieldset>
      <label>Next reset<input id="anchor" type="datetime-local" required></label>
      <p class="hint">Use the time shown in ChatGPT. Repeats every 5 hours.</p>
      <p id="form-error" class="form-error" role="alert"></p>
      <button type="submit" class="wide">Save</button>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
